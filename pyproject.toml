[project]
name = "simple-rag"
version = "0.1.0"
description = "RAG-ассистент по годовым отчётам: LlamaIndex + ChromaDB + Gradio"
readme = "README.md"
requires-python = "==3.13.9"
dependencies = [
    "bm25s==0.3.10",
    "chromadb==1.5.9",
    "gradio==6.20.0",
    "llama-index-core==0.14.23",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-llms-openai-like==0.7.2",
    "llama-index-postprocessor-sbert-rerank==0.5.0",
    "llama-index-vector-stores-chroma==0.5.5",
    "pymupdf4llm==1.28.0",
    "pystemmer==2.2.0.3",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "sentence-transformers==5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
