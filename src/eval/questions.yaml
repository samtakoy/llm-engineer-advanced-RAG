# Контрольные вопросы для сравнения выдачи до и после добавления практик Advanced RAG.
#
# Эталонные страницы сверены с parsed/ — факт действительно лежит на указанной странице.
# Формат ссылки на страницу: "СОКРАЩЕНИЕ:номер", сокращения расшифрованы в documents.
#
# expected_pages — список групп. Внутри группы достаточно любой страницы, но покрыты
# должны быть все группы. Так вопрос с агрегацией требует обоих документов сразу,
# а вопрос с одним фактом, продублированным в таблице и в тексте, — любого из двух мест.
#
# expected_snippets — дословные куски, которые обязаны оказаться в тексте выдачи.
# Страница может найтись, а нужный фрагмент этой страницы — нет: тогда проверка по
# страницам покажет успех, хотя до модели факт не дошёл. Подстроки ловят такой случай
# и, в отличие от эталонных узлов, не зависят от размера чанка.
# Каждая подстрока сверена с индексом: написание взято из корпуса, а не придумано.

documents:
  FY2024: "FY2024_Issuer's report.pdf"
  FY2025: "Отчет эмитента МКПАО ЮМГ 12м2025.pdf"

cases:
  - number: 1
    kind: факт
    question: Какую долю выручки составила EBITDA группы в 2025 году?
    expected_answer: 40,9%
    expected_pages:
      - ["FY2025:10", "FY2025:11"]
    expected_snippets: ["40,9"]
    checks: Базовое извлечение факта из таблицы.
    distractor: В той же строке таблицы стоит 45,5% за 2024 год.

  - number: 2
    kind: факт
    question: Сколько пациентов может одновременно лежать в стационаре «Семейного доктора»?
    expected_answer: 78 коек
    expected_pages:
      - ["FY2025:7"]
    expected_snippets: ["78 коек"]
    checks: Точечный факт внутри длинного описательного абзаца.
    distractor: Редкое имя собственное — территория лексического поиска, а не векторного.

  - number: 3
    kind: ловушка
    question: Сколько раз пациенты обращались за амбулаторной помощью по группе за весь 2025 год?
    expected_answer: 359 443 визита
    expected_pages:
      - ["FY2025:8"]
    expected_snippets: ["359 443"]
    checks: Различение периметра и периода.
    distractor: >-
      На стр. 9 стоит таблица с числом 307 539 — это АО «Семейный доктор» за ноябрь–декабрь,
      а не Группа за год. Названия строк в обеих таблицах совпадают.

  - number: 4
    kind: ловушка
    question: Во сколько в рублях обходится одна госпитализация?
    expected_answer: 154 175 рублей
    expected_pages:
      - ["FY2025:9"]
    expected_snippets: ["154 175"]
    checks: Зеркало вопроса 3 — не сваливается ли система всегда в одну и ту же таблицу.
    distractor: На стр. 8 стоит средний чек стационара 4 706 евро.

  - number: 5
    kind: агрегация
    question: Группа стала зарабатывать больше или меньше по EBITDA в евро за 2023, 2024 и 2025 годы?
    expected_answer: 115,9 млн евро в 2023, 115,4 млн евро в 2024, 118,5 млн евро в 2025
    expected_pages:
      - ["FY2024:7"]
      - ["FY2025:10", "FY2025:11"]
    expected_snippets: ["115.9", "118,5"]
    checks: >-
      Агрегация из двух разных файлов и две разные ссылки в одном ответе.
      Прямое требование технического задания к вопросу с агрегацией.
    distractor: ""

  - number: 6
    kind: агрегация
    question: Кто из кредиторов ограничивает компанию условиями по долгу и какие это условия?
    expected_answer: >-
      Райффайзенбанк и Сбербанк. Отношение чистого долга к EBITDA не более 3,0,
      коэффициент автономии не менее 20%.
    expected_pages:
      - ["FY2024:36"]
      - ["FY2024:37"]
    expected_snippets: ["Райффайзенбанк", "Сбербанк"]
    checks: Редкие имена собственные, факт на глубокой странице, сборка из двух страниц.
    distractor: В отчёте за 2025 год тот же сюжет изложен без названий банков.

  - number: 7
    kind: таблица
    question: Какая частная клиника в России зарабатывает больше всех и сколько?
    expected_answer: ГК «Медси», выручка 50,3 млрд рублей
    expected_pages:
      - ["FY2025:7"]
    expected_snippets: ["Медси", "50,3"]
    checks: Чтение таблицы по данным Vademecum.
    distractor: >-
      Таблица попадает в число тех, что режутся по границе чанка, — часть строк уходит
      в узел без шапки колонок.

  - number: 8
    kind: разброс
    question: За счёт чего компания рассчитывает расти дальше?
    expected_answer: >-
      Родильный дом EMC, реабилитационный центр в Жуковке, онкологические центры
      в Москве и других регионах России.
    expected_pages:
      - ["FY2024:14", "FY2024:15", "FY2024:35"]
    expected_snippets: ["Жуковке"]
    checks: Сборка ответа из далеко разнесённых страниц, территория MMR.
    distractor: Выдача склонна схлопываться в одну зону документа.

  - number: 9
    kind: парсинг
    question: Какого размера онкоклиника при МОНИКИ — сколько мест и какая площадь?
    expected_answer: 27 коек, площадь 4 655 квадратных метров
    expected_pages:
      - ["FY2024:15"]
    expected_snippets: ["4 655"]
    checks: >-
      Качество разбора, а не качество поиска. Ни один приём Advanced RAG этого не исправит —
      чинится только парсером. Вопрос отделяет «поиск промахнулся» от «в индексе мусор».
    distractor: >-
      Страница разрушена разбором PDF, в индексе лежит «Клиника 27 д 4 655 д М рассчитана
      на коек и занимает площаь кваратных метров».

  - number: 10
    kind: провокация
    question: Сколько стоит первичный приём кардиолога в ЕМС?
    expected_refusal: true
    expected_answer: Я не знаю
    expected_pages: []
    expected_snippets: []
    checks: >-
      Устойчивость к галлюцинациям, и главное — что модель не выдумывает несуществующие
      номера страниц.
    distractor: >-
      Вопрос станет отвечаемым, если в корпус добавить страницы с прайсом. Тогда он же
      измерит пользу от расширения корпуса.

  - number: 11
    kind: длинный ответ
    question: Чего компания опасается в денежной части — какие угрозы она перечисляет?
    expected_answer: >-
      Раздел 1.9.3 «Финансовые риски»: валютный риск, процентный риск, кредитный риск,
      риск ликвидности.
    expected_pages:
      - ["FY2024:26", "FY2025:24"]
    expected_snippets: ["ликвидности"]
    checks: >-
      Удерживает ли модель ссылки на длинном многопунктовом ответе и на каком по счёту
      факте они начинают пропадать. Узкое место, о котором прямо спрашивает техническое задание.
    distractor: ""

  - number: 12
    kind: агрегация
    question: Насколько компания приблизилась к предельной долговой нагрузке, которую поставили кредиторы?
    expected_answer: >-
      Отношение чистого долга к EBITDA составляет 0,95х при установленном банками
      пределе не более 3,0 — запас есть.
    expected_pages:
      - ["FY2025:10"]
      - ["FY2024:36", "FY2024:37"]
    expected_snippets: ["0,95", "не более 3,0"]
    checks: >-
      Ответа нет ни на одной странице целиком: текущее значение лежит в отчёте за 2025 год,
      а предел — в разделе о рисках отчёта за 2024 год. Нужны оба документа сразу.
    distractor: Ни одна из двух страниц по отдельности на вопрос не отвечает.

  - number: 13
    kind: агрегация
    question: Сколько человек группа положила в стационар в 2025 году и почему лечение подорожало?
    expected_answer: >-
      22 660 госпитализаций, рост на 3,5%. Средний чек вырос на 7,4% за счёт увеличения
      сложности проводимых оперативных вмешательств.
    expected_pages:
      - ["FY2025:8"]
      - ["FY2025:9"]
    expected_snippets: ["22 660", "сложности проводимых"]
    checks: >-
      Ответа нет ни на одной странице целиком: число госпитализаций на одной странице,
      объяснение роста стоимости — на следующей.
    distractor: >-
      Страница 9 содержит ещё и таблицу «Семейного доктора» за ноябрь–декабрь,
      из которой легко взять чужие числа.

  - number: 14
    kind: факт
    question: Сколько пациентов приходило в поликлинику в 2023 году?
    expected_answer: 386 490 визитов
    expected_pages:
      - ["FY2024:6"]
    expected_snippets: ["386 490"]
    checks: >-
      Данные за 2023 год есть только в отчёте за 2024 год — вопрос заставляет открыть
      старый документ.
    distractor: >-
      В отчёте за 2025 год на стр. 8 стоят похожие числа за другие годы:
      360 134 за 2024 и 359 443 за 2025.

  - number: 15
    kind: неполные данные
    question: Какая была выручка группы в рублях по годам?
    expected_answer: >-
      В рублях раскрыта только выручка за 2024 год — 25 371,8 млн руб. За 2023 год
      приведён лишь рост на 3,0%, за 2025 год рублёвых данных нет: группа отчитывается
      в евро.
    expected_pages:
      - ["FY2024:8"]
    expected_snippets: ["25 371,8"]
    checks: >-
      Сообщит ли модель о неполноте данных вместо того, чтобы досчитать недостающие
      годы из евро по курсу. Год в вопросе не назван — документ выбирается по содержанию
      запроса, а не по дате.
    distractor: >-
      Выручка в евро есть за все три года, а рублёвые числа на стр. 9 отчёта за 2025 год
      принадлежат «Семейному доктору», а не группе.

  - number: 16
    kind: агрегация
    question: Пациентов в поликлинике в 2024 и 2025 стало больше или меньше относительно 2023 года?
    expected_answer: >-
      Меньше в оба года: 386 490 визитов в 2023, 360 134 в 2024, 359 443 в 2025.
    expected_pages:
      - ["FY2024:6"]
      - ["FY2025:8"]
    expected_snippets: ["386 490", "359 443"]
    checks: >-
      Три точки из двух документов: 2023 и 2024 год лежат в старом отчёте, 2025 — в новом.
    distractor: >-
      Значение за 2024 год есть в обоих отчётах, за 2023 — только в старом.
